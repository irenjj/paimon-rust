[workspace]
resolver = "2"
members = ["crates/integrations/datafusion"]
# Cargo resolves the entire workspace when building its lockfile, even with -p.
exclude = ["crates/paimon"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95.0"

[workspace.dependencies]
arrow = "60.2.0"
arrow-select = "60.2.0"
datafusion-common = { version = "=57.0.0-dev", default-features = false }
datafusion-expr = { version = "=57.0.0-dev", default-features = false }
datafusion-session = { version = "=57.0.0-dev", default-features = false }
datafusion-catalog = { version = "=57.0.0-dev", default-features = false }
datafusion-datasource = { version = "=57.0.0-dev", default-features = false }
datafusion-datasource-parquet = { version = "=57.0.0-dev", default-features = false }
datafusion-execution = { version = "=57.0.0-dev", default-features = false }
datafusion-physical-plan = { version = "=57.0.0-dev", default-features = false }
datafusion-physical-expr = { version = "=57.0.0-dev", default-features = false }
datafusion-physical-expr-adapter = { version = "=57.0.0-dev", default-features = false }
datafusion-functions-nested = { version = "=57.0.0-dev", default-features = false }
datafusion-physical-expr-common = { version = "=57.0.0-dev", default-features = false }
datafusion-functions = { version = "=57.0.0-dev", default-features = false }
paimon = { version = "0.6.0", path = "crates/paimon", default-features = false }
parquet = "60.2.0"
tokio = "1.39.2"
