[workspace]
resolver = "2"
members = [
    "crates/paimon",
    "crates/integrations/datafusion",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
homepage = "https://paimon.apache.org/docs/rust/"
repository = "https://github.com/apache/paimon-rust"
license = "Apache-2.0"
rust-version = "1.95.0"

[workspace.dependencies]
arrow = "60.2.0"
arrow-array = { version = "60.2.0", features = ["ffi"] }
arrow-arith = "60.2.0"
arrow-buffer = "60.2.0"
arrow-schema = "60.2.0"
arrow-cast = "60.2.0"
arrow-ipc = "60.2.0"
arrow-json = "60.2.0"
arrow-ord = "60.2.0"
arrow-row = "60.2.0"
arrow-select = "60.2.0"
arrow-string = "60.2.0"
datafusion-common = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/common" }
datafusion-expr = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/expr" }
datafusion-session = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/session" }
datafusion-catalog = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/catalog" }
datafusion-datasource = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/datasource" }
datafusion-datasource-parquet = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/datasource-parquet" }
datafusion-execution = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/execution" }
datafusion-physical-plan = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/physical-plan" }
datafusion-physical-expr = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/physical-expr" }
datafusion-physical-expr-adapter = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/physical-expr-adapter" }
datafusion-functions-nested = { path = "/home/renjj/.paseo/worktrees/0k1e574a/df-lake-plan/datafusion/functions-nested" }
