[package]
autotests = false
autoexamples = false
name = "paimon-datafusion"
edition.workspace = true
version.workspace = true
publish = ["crates-io"]
license.workspace = true
rust-version.workspace = true
homepage = "https://paimon.apache.org/docs/rust/datafusion/"
documentation = "https://docs.rs/paimon-datafusion"
description = "Apache Paimon DataFusion Integration"
categories = ["database"]
keywords = ["paimon", "datafusion", "integrations"]

[features]
dml = []
vortex = ["paimon/vortex"]

[dependencies]
arrow = { workspace = true }
sqlparser = { version = "0.63.0", default-features = false, features = ["std", "visitor"] }
arrow-select = { workspace = true }
async-trait = "0.1"
datafusion-common = { workspace = true }
datafusion-expr = { workspace = true, features = ["sql"] }
datafusion-session = { workspace = true }
datafusion-catalog = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-datasource-parquet = { workspace = true }
datafusion-execution = { workspace = true }
datafusion-physical-plan = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-physical-expr-common = { workspace = true }
datafusion-physical-expr-adapter = { workspace = true }
datafusion-functions-nested = { workspace = true, features = ["sql"] }
log = "0.4"
paimon = { workspace = true, features = ["storage-memory", "storage-fs"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
chrono = "0.4"
datafusion-functions = { workspace = true, features = ["string_expressions"] }
flate2 = "1"
parquet = { workspace = true }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
